name: Validate Infrastructure Configuration

on:
  push:
    paths:
      - "terraform/**"
      - "ansible/**"
      - "k8s/**"
      - ".github/workflows/validate-infrastructure.yml"
  pull_request:
    paths:
      - "terraform/**"
      - "ansible/**"
      - "k8s/**"
      - ".github/workflows/validate-infrastructure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_ami_id: ami-0123456789abcdef0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without backend
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate

  ansible:
    name: Ansible syntax validation only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.17.7
      - name: Check playbook syntax (does not connect to hosts)
        run: ansible-playbook -i 'localhost,' -c local ansible/site.yml --syntax-check

  kubernetes:
    name: Kubernetes manifest schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate manifests (no cluster deployment)
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary k8s/deployment.yaml
