name: Observability Platform CI

on:
  push:
    paths:
      - "observability/**"
      - ".github/workflows/observability-ci.yml"
  pull_request:
    paths:
      - "observability/**"
      - ".github/workflows/observability-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run application unit tests
        working-directory: observability/app
        run: npm test
      - name: Validate Compose configuration
        working-directory: observability
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate Prometheus config and alert rules
        working-directory: observability
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" prom/prometheus:v2.54.1 promtool check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" prom/prometheus:v2.54.1 promtool check rules /etc/prometheus/alerts.yml
      - name: Build application image
        working-directory: observability
        run: docker build -t observability-demo-app:ci ./app
      - name: Start monitoring stack
        working-directory: observability
        run: docker compose up -d --build
      - name: Wait for app, Prometheus and Grafana
        working-directory: observability
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null && curl --fail --silent http://127.0.0.1:9090/-/ready >/dev/null && curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Verify Prometheus scrape and metrics
        working-directory: observability
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/orders >/dev/null
          for attempt in $(seq 1 12); do
            up_result=$(curl --fail --silent 'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22demo-app%22%7D')
            if echo "$up_result" | jq -e '.status == "success" and .data.result[0].value[1] == "1"' >/dev/null; then break; fi
            sleep 5
          done
          echo "$up_result" | jq -e '.status == "success" and .data.result[0].value[1] == "1"'
          for attempt in $(seq 1 12); do
            metric_result=$(curl --fail --silent 'http://127.0.0.1:9090/api/v1/query?query=demo_http_requests_total')
            if echo "$metric_result" | jq -e '.status == "success" and (.data.result | length) > 0' >/dev/null; then break; fi
            sleep 5
          done
          echo "$metric_result" | jq -e '.status == "success" and (.data.result | length) > 0'
      - name: Run smoke tests
        working-directory: observability
        run: bash tests/smoke-test.sh
      - name: Capture diagnostics on failure
        if: failure()
        working-directory: observability
        run: docker compose ps && docker compose logs --no-color
      - name: Stop stack
        if: always()
        working-directory: observability
        run: docker compose down -v