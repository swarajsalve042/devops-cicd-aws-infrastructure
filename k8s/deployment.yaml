apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-app
  template:
    metadata:
      labels:
        app: analytics-app
    spec:
      containers:
      - name: analytics-app
        image: <registry>/analytics-app:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-app
spec:
  type: NodePort
  selector:
    app: analytics-app
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30008
