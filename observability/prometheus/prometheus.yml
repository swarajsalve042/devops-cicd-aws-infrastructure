global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: devops-observability-lab
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: demo-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]